exclude: ^(\.agents/skills/|skills/formal-verify/examples/lean-template/\.lake/)

repos:
  - repo: local
    hooks:
      - id: tests
        name: Test plugin metadata, skill references and verification helpers
        entry: node --test 'tests/*.test.mjs'
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: c01a1853c19b175aee6a09f24e2ad9b748c485ad # frozen: v0.24.1
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
      # SC2251 is info-level: a `! cmd` assertion does not stop a `set -e` script.
      - id: shellcheck
        alias: shellcheck-negated-errexit
        name: shellcheck (negated commands under set -e)
        args: [--include=SC2251]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10 # frozen: v0.17.6
    hooks:
      - id: ruff-check
        args: [--isolated]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
