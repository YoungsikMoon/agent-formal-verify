name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install prek
        run: |
          python3 -m venv "$RUNNER_TEMP/prek"
          "$RUNNER_TEMP/prek/bin/pip" install -r .github/requirements.txt
      - name: Validate repository
        run: '"$RUNNER_TEMP/prek/bin/prek" run --all-files'

  skills-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
        working-directory: tests/skills-cli
      - run: tests/skills-cli/node_modules/.bin/skills add ./skills --skill '*' --agent codex --yes --copy
      - run: diff -qr skills .agents/skills

  # A Mac runs the helpers' #!/bin/bash with Bash 3.2. The container swaps its
  # own Bash for GNU Bash 3.2.57, so the runner's Bash stays untouched.
  bash-3:
    name: Helper tests with Bash 3.2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:24-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    env:
      BASH_TARBALL_DIR: /tmp/bash-tarball
      BASH_TARBALL_SHA256: 3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BASH_TARBALL_DIR }}
          key: bash-3.2.57-${{ env.BASH_TARBALL_SHA256 }}
      - name: Build GNU Bash 3.2.57 and install it as the container's Bash
        run: |
          cd "$RUNNER_TEMP"
          # The release's y.tab.c predates its parse.y patches, so make regenerates it with bison.
          { apt-get update && apt-get install -y --no-install-recommends bison=2:3.8.2+dfsg-1+b1; } > apt.log 2>&1 || { tail -n 40 apt.log; exit 1; }
          bash "$GITHUB_WORKSPACE/.github/fetch-bash.sh"
          tar -xzf "$BASH_TARBALL_DIR/bash-3.2.57.tar.gz"
          cd bash-3.2.57
          ./configure --without-bash-malloc --disable-nls > configure.log 2>&1 || { tail -n 40 configure.log; exit 1; }
          make -j"$(nproc)" > make.log 2>&1 || { tail -n 60 make.log; exit 1; }
          install -m 755 bash /usr/bin/bash
      - name: Run the helper and metadata tests as an unprivileged user
        run: |
          for shell in bash /bin/bash; do
            "$shell" --version | grep "GNU bash, version 3\.2\." || { echo "::error::$shell is not Bash 3.2"; exit 1; }
          done
          chown -R node:node .
          su node -c "node --test 'tests/*.test.mjs'"

  models:
    name: Example models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: false
          use-github-cache: false
          lake-package-directory: skills/formal-verify/examples/lean-template
      - name: Fetch the pinned TLC release
        run: |
          scripts=skills/formal-verify/scripts
          pin=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); import tlc; print(tlc.Tlc.version, tlc.Tlc.cached_jar())' "$scripts")
          read -r version jar <<< "$pin"
          mkdir -p "$(dirname "$jar")"
          curl -fL --no-progress-meter --retry 3 -o "$jar" "https://github.com/tlaplus/tlaplus/releases/download/$version/tla2tools.jar"
          python3 "$scripts/tlc.py" ready
      - name: Install pinned Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Check the examples and their mutations with TLC, Lean and Kani
        run: bash tests/models.sh

  # The models job uses the template's pin. Lean 4.20.0 is the oldest pin the
  # helpers support, and it numbers hygienic names and match helpers differently.
  lean-oldest:
    name: Lean regressions on the oldest supported pin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: false
          use-github-cache: false
          lake-package-directory: skills/formal-verify/examples/lean-template
      - name: Install Lean 4.20.0
        run: elan toolchain install leanprover/lean4:v4.20.0
      - name: Check Lean declaration discovery, freezing and mutation coverage on Lean 4.20.0
        run: bash tests/lean-mutations.sh leanprover/lean4:v4.20.0

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check local links and heading anchors
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --offline --no-progress --include-fragments \
            --exclude-path .git --exclude-path .agents/skills \
            --exclude-path node_modules --exclude-path .lake '**/*.md'

  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.29.0"
          advanced-security: false
          annotations: true
          persona: pedantic
          min-severity: low
